type User @table {
  username: String!
  email: String!
  isCreator: Boolean!
  bio: String
  profileImageUrl: String
  subscriptionStatus: String
}

type Series @table {
  title: String!
  genre: String!
  creator: User!
  createdAt: Timestamp!
  description: String
  coverImageUrl: String
  totalLikes: Int
}

type Chapter @table {
  series: Series!
  chapterNumber: Int!
  title: String!
  contentData: String!
  publishedAt: Timestamp
  viewCount: Int
}

type Interaction @table {
  user: User!
  # targetId stores the UUID of either a Series or a Chapter
  targetId: UUID!
  type: String!
  commentText: String
}

type Follow @table {
  follower: User!
  creator: User!
  followedAt: Timestamp!
}

type Analytics @table {
  series: Series!
  date: Date!
  views: Int!
  interactionsCount: Int!
}